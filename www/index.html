<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart IPTV Pro</title>
    <!-- إضافة خطوط عربية جميلة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- إضافة مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#00a8e8', // اللون الأزرق السماوي المميز
                        'dark-bg': '#121212',
                        'card-bg': '#1e1e1e',
                    },
                    fontFamily: {
                        'cairo': ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Cairo', sans-serif; user-select: none; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00a8e8; }
        
        /* تأثير نيون خفيف على العناصر النشطة */
        .neon-blue { text-shadow: 0 0 5px rgba(0, 168, 232, 0.7); }
        
        /* تحسين شكل الكروت */
        .item-card { transition: all 0.3s ease; border: 1px solid transparent; position: relative; overflow: hidden;}
        .item-card:hover { transform: translateY(-5px); border-color: #00a8e8; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5); }
        .item-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #00a8e8; transform: scaleX(0); transition: transform 0.3s ease; }
        .item-card:hover::after { transform: scaleX(1); }
        
        /* تنسيق تبويبات الأقسام */
        .nav-btn { color: #9e9e9e; border-bottom: 3px solid transparent; padding-bottom: 10px; transition: all 0.3s; }
        .nav-btn.active { color: #00a8e8; border-bottom-color: #00a8e8; font-weight: bold; }
        
        /* تنسيق الباقات الجانبية */
        .cat-btn { background: #2c2c2c; color: #bdbdbd; border-radius: 20px; padding: 5px 15px; margin-bottom: 8px; display: block; text-align: right; transition:all 0.2s; font-size: 0.9rem;}
        .cat-btn.active, .cat-btn:hover { background: #00a8e8; color: white; font-weight: 600;}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- شاشة تسجيل الدخول (معدلة بشكل أشيك) -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-6 bg-cover bg-center" style="background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://wallpaper.dog/large/10877626.jpg');">
        <div class="w-full max-w-lg bg-card-bg/80 backdrop-blur-sm border border-gray-700 rounded-3xl p-10 shadow-2xl">
            <div class="text-center mb-10">
                <i class="fa-solid fa-tv text-6xl text-primary mb-4 neon-blue"></i>
                <h1 class="text-4xl font-bold text-white tracking-tight">Smart <span class="text-primary neon-blue">IPTV Pro</span></h1>
                <p class="text-gray-400 mt-2">أدخل بيانات Xtream Codes الخاصة بك</p>
            </div>
            
            <form id="login-form" class="space-y-6">
                <div class="relative">
                    <i class="fa-solid fa-user absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="username" required placeholder="اسم المستخدم (Username)" class="w-full bg-gray-900/50 border border-gray-700 focus:ring-2 focus:ring-primary rounded-xl px-12 py-4 text-white focus:outline-none text-left" dir="ltr">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-key absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="password" required placeholder="كلمة المرور (Password)" class="w-full bg-gray-900/50 border border-gray-700 focus:ring-2 focus:ring-primary rounded-xl px-12 py-4 text-white focus:outline-none text-left" dir="ltr">
                </div>
                <div id="login-error" class="text-red-400 text-sm text-center hidden p-3 bg-red-500/10 rounded-lg border border-red-500/20"></div>
                <button type="submit" id="login-btn" class="w-full bg-primary hover:bg-sky-600 active:scale-[0.98] transition text-gray-950 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 text-lg">
                    تسجيل الدخول
                </button>
            </form>
             <p class="text-center text-xs text-gray-600 mt-8">نظام تشغيل IPTV احترافي</p>
        </div>
    </div>

    <!-- الشاشة الرئيسية للتطبيق -->
    <div id="main-screen" class="hidden flex-1 flex flex-col h-full bg-dark-bg">
        <!-- الهيدر الاحترافي -->
        <header class="bg-card-bg border-b border-gray-800 px-6 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-tv text-2xl text-primary neon-blue"></i>
                <h2 class="font-bold text-2xl tracking-tight text-white">Smart <span class="text-primary">IPTV Pro</span></h2>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-gray-900 px-4 py-2 rounded-full border border-gray-700">
                    <i class="fa-solid fa-calendar-days text-primary text-sm"></i>
                    <span id="exp-date" class="text-sm text-gray-300"></span>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-white transition group">
                    <i class="fa-solid fa-right-from-bracket group-hover:scale-110 transition"></i> تسجيل خروج
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- الشريط الجانبي للباقات (أشبه بالـ TV) -->
            <aside class="w-1/4 bg-card-bg border-l border-gray-800 p-5 flex flex-col">
                 <!-- شريط البحث -->
                <div class="relative mb-6">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-600"></i>
                    <input type="text" id="search-input" onkeyup="filterItems()" placeholder="بحث سريع..." class="w-full bg-gray-900 border border-gray-700 rounded-full px-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary pr-10">
                </div>
                
                <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                    <h3 class="text-lg font-semibold text-gray-200" id="sidebar-title">الباقات</h3>
                    <span id="items-count" class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded-md">0</span>
                </div>
                
                <div id="categories-bar" class="flex-1 overflow-y-auto pr-1 space-y-1">
                    <!-- يتم تعبئتها بالجافاسكريبت -->
                </div>
                
                 <!-- تبويبات الأقسام الرئيسية (تحت) -->
                <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-gray-800 text-center">
                    <button onclick="switchSection('live')" id="tab-live" class="nav-btn active flex flex-col items-center gap-1.5 text-sm"><i class="fa-solid fa-satellite-dish"></i> القنوات</button>
                    <button onclick="switchSection('vod')" id="tab-vod" class="nav-btn flex flex-col items-center gap-1.5 text-sm"><i class="fa-solid fa-film"></i> الأفلام</button>
                    <button onclick="switchSection('series')" id="tab-series" class="nav-btn flex flex-col items-center gap-1.5 text-sm"><i class="fa-solid fa-masks-theater"></i> المسلسلات</button>
                </div>
            </aside>

            <!-- منطقة المحتوى ومشغل الفيديو -->
            <main class="flex-1 flex flex-col h-full bg-dark-bg overflow-hidden">
                
                <!-- مشغل الفيديو (فوق المحتوى) -->
                <div id="player-container" class="hidden bg-black relative w-full aspect-video border-b border-gray-700">
                    <video id="video-player" controls playsinline class="w-full h-full object-contain"></video>
                    <button onclick="closePlayer()" class="absolute top-4 right-4 bg-black/70 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-red-600 transition z-10">✕</button>
                     <div id="now-playing" class="absolute bottom-12 right-6 bg-black/70 px-5 py-2 rounded-lg text-sm text-white font-semibold pointer-events-none shadow-xl"></div>
                </div>

                <!-- الشبكة (Grid) الخاصة بالقنوات/الأفلام -->
                <div id="content-grid" class="flex-1 overflow-y-auto p-6 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-5 content-start bg-dark-bg">
                    <!-- يتم تعبئتها بالجافاسكريبت ببطاقات الـ item-card -->
                </div>
            </main>
        </div>
    </div>

    <!-- نافذة الحلقات (Modal) -->
    <div id="series-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-card-bg border border-gray-700 w-full max-w-3xl rounded-3xl max-h-[80vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center sticky top-0 bg-card-bg rounded-t-3xl z-10">
                <h3 id="series-modal-title" class="font-bold text-2xl text-white">معلومات المسلسل</h3>
                <button onclick="closeSeriesModal()" class="text-gray-400 hover:text-white text-2xl transition w-10 h-10 rounded-full hover:bg-gray-700 flex items-center justify-center">✕</button>
            </div>
            <div id="episodes-list" class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- سيتم ملؤها بالجافاسكريبت -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
